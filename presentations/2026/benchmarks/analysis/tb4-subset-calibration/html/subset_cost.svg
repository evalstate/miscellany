ext x="840.0" y="414.0" font-family="'Inter','Noto Sans',sans-serif" font-size="23" font-weight="800" fill="#1f1e1d" text-anchor="start" >Why 6.5× and not 3.5×?</text><text x="840.0" y="440.0" font-family="'Inter','Noto Sans',sans-serif" font-size="15" font-weight="500" fill="#8a867d" text-anchor="start" >The subset avoids the expensive tasks</text><text x="840.0" y="486.0" font-family="'Inter','Noto Sans',sans-serif" font-size="14" font-weight="600" fill="#8a867d" text-anchor="start" >Average cost of a task, relative to an average Terminal-Bench 4.0 task</text><text x="840.0" y="524.0" font-family="'Inter','Noto Sans',sans-serif" font-size="16" font-weight="700" fill="#1f1e1d" text-anchor="start" >All 66 tasks</text><rect x="840" y="536" width="373.3" height="24" rx="6" fill="#4d5059"/><text x="1225.3" y="555.0" font-family="'Inter','Noto Sans',sans-serif" font-size="17" font-weight="800" fill="#1f1e1d" text-anchor="start" >1.00×</text><text x="840.0" y="598.0" font-family="'Inter','Noto Sans',sans-serif" font-size="16" font-weight="700" fill="#1f1e1d" text-anchor="start" >GPU, multi-container and refusal tasks (excluded)</text><rect x="840" y="610" width="534.0" height="24" rx="6" fill="#9d978a"/><text x="1386.0" y="629.0" font-family="'Inter','Noto Sans',sans-serif" font-size="17" font-weight="800" fill="#1f1e1d" text-anchor="start" >1.43×</text><text x="840.0" y="672.0" font-family="'Inter','Noto Sans',sans-serif" font-size="16" font-weight="700" fill="#1f1e1d" text-anchor="start" >Tasks meeting the constraints (48)</text><rect x="840" y="684" width="313.1" height="24" rx="6" fill="#8c8f97"/><text x="1165.1" y="703.0" font-family="'Inter','Noto Sans',sans-serif" font-size="17" font-weight="800" fill="#1f1e1d" text-anchor="start" >0.84×</text><text x="840.0" y="746.0" font-family="'Inter','Noto Sans',sans-serif" font-size="16" font-weight="700" fill="#1f1e1d" text-anchor="start" >This subset (19)</text><rect x="840" y="758" width="200.4" height="24" rx="6" fill="#d9774f"/><text x="1052.4" y="777.0" font-family="'Inter','Noto Sans',sans-serif" font-size="17" font-weight="800" fill="#b8552d" text-anchor="start" >0.54×</text><line x1="1213.3" y1="524.0" x2="1213.3" y2="804.0" stroke="#8a867d" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="840" y="834" width="700" height="150" rx="14" fill="#f3f1ea"/><text x="864.0" y="872.0" font-family="'Inter','Noto Sans',sans-serif" font-size="18" font-weight="800" fill="#1f1e1d" text-anchor="start" >The arithmetic</text><text x="864.0" y="906.0" font-family="'Inter','Noto Sans',sans-serif" font-size="17" font-weight="600" fill="#4a4843" text-anchor="start" >330 ÷ 95 trials = 3.47×</text><text x="864.0" y="936.0" font-family="'Inter','Noto Sans',sans-serif" font-size="17" font-weight="600" fill="#4a4843" text-anchor="start" >…but each subset trial costs 0.54× an average trial</text><text x="864.0" y="966.0" font-family="'Inter','Noto Sans',sans-serif" font-size="17" font-weight="800" fill="#b8552d" text-anchor="start" >3.47 ÷ 0.54 ≈ 6.5× — the multiplier</text><line x1="60.0" y1="1064.0" x2="1540.0" y2="1064.0" stroke="#dedad0" stroke-width="1" /><text x="60.0" y="1108.0" font-family="'Inter','Noto Sans',sans-serif" font-size="24" font-weight="800" fill="#1f1e1d" text-anchor="start" >Budget a full run at about 6.5× what the subset cost you; expect ±10%, occasionally ±25%.</text><text x="60.0" y="1144.0" font-family="'Inter','Noto Sans',sans-serif" font-size="12.5" font-weight="400" fill="#8a867d" text-anchor="start" >Source: public Terminal-Bench 4.0 leaderboard trial costs. 15 of 27 entries used: all 330 trial costs present and summing to the published total (10 excluded for missing trial costs, 2 for totals that don&#x27;t reconcile).</text><text x="60.0" y="1164.0" font-family="'Inter','Noto Sans',sans-serif" font-size="12.5" font-weight="400" fill="#8a867d" text-anchor="start" >Estimate for each entry uses the median full ÷ subset ratio of the other models (all efforts of the entry&#x27;s own model left out). Reported leaderboard costs, not invoices; sandbox compute excluded.</text><text x="60.0" y="1184.0" font-family="'Inter','Noto Sans',sans-serif" font-size="12.5" font-weight="400" fill="#8a867d" text-anchor="start" >The multiplier reflects these agents and models; a harness that spends very differently on cheap vs expensive tasks will shift it.</text></svg>