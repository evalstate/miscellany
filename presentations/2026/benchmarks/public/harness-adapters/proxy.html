<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A reverse proxy between the harness and the model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  /* Embedded in the blog post: no page chrome, the post's background shows through */
  body { background: transparent; }
  figure, figure.wide { margin: 0; }
</style>
<meta property="og:title" content="Harness adapters figures"><meta property="og:image" content="https://cdn-thumbnails.huggingface.co/social-thumbnails/spaces/harness-hub/harness-adapters-figures.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://cdn-thumbnails.huggingface.co/social-thumbnails/spaces/harness-hub/harness-adapters-figures.png"></head>
<body>
    <figure>
      <div class="lora-fx" id="proxy-fx" aria-label="animated diagram: safeagents sits between the harness and the model server and checks every tool call">
        <div class="lora-fx__header">
          <span class="lora-fx__title">A reverse proxy between the harness and the model</span>
          <button class="lora-fx__btn" data-proxy-play>pause</button>
          <button class="lora-fx__btn" data-proxy-replay>replay</button>
          <label class="lora-fx__speed">speed <input type="range" min="0.5" max="2.5" step="0.5" value="1.5" data-proxy-speed><span class="lora-fx__speed-val">1.5×</span></label>
        </div>
        <div class="lora-fx__body"><svg viewBox="0 44 1000 266" role="img" aria-label="the harness sends a request through safeagents to vLLM; the tool call in the response passes three checks, or is replaced by a notice"></svg></div>
        <figcaption class="lora-fx__caption" aria-live="polite"></figcaption>
      </div>
    </figure>
<script src="proxy.js"></script>
</body>
