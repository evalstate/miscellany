<body>
  <div class="hero-banner">
    <div class="hero-scene" id="hero-scene" role="img" aria-label="animation: three harnesses send requests to one vLLM, each naming its own LoRA adapter, trainers load new adapter versions, then every checkpoint is evaluated side by side in one job"></div>
  </div>
<script src="hero.js"></script>
<script>
// Plays in real time while on screen; with reduced motion, one still frame
(() => {
  const box = document.getElementById("hero-scene");
  const hero = mountHero(box);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { hero.render(6.4); return; }
  let t = 0, last = performance.now(), visible = true;
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(box);
  const loop = (now) => {
    if (visible) { t = (t + Math.min(0.25, (now - last) / 1000)) % hero.duration; hero.render(t); }
    last = now;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
