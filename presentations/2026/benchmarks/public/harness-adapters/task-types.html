<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four task types</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  /* Embedded in the blog post: no page chrome, the post's background shows through */
  body { background: transparent; }
  figure, figure.wide { margin: 0; }
</style>
<meta property="og:title" content="Harness adapters figures"><meta property="og:image" content="https://cdn-thumbnails.huggingface.co/social-thumbnails/spaces/harness-hub/harness-adapters-figures.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://cdn-thumbnails.huggingface.co/social-thumbnails/spaces/harness-hub/harness-adapters-figures.png"></head>
<body>
    <figure class="wide">
      <figure class="lora-fx" id="tt-fx" aria-label="animated diagram: for each of the four task types, what the agent gets, what it does and how the verifier scores it">
        <div class="lora-fx__header">
          <span class="lora-fx__title">Four task types</span>
          <span class="lora-fx__seg">
            <button class="lora-fx__btn" data-tt-family>repair</button>
            <button class="lora-fx__btn" data-tt-family>build</button>
            <button class="lora-fx__btn" data-tt-family>extend</button>
            <button class="lora-fx__btn" data-tt-family>qa</button>
          </span>
          <button class="lora-fx__btn" data-tt-play>pause</button>
          <button class="lora-fx__btn" data-tt-replay>replay</button>
          <label class="lora-fx__speed">speed <input type="range" min="0.5" max="2.5" step="0.5" value="1" data-tt-speed><span class="lora-fx__speed-val">1.0×</span></label>
        </div>
        <div class="lora-fx__body"><svg viewBox="0 40 1000 250" role="img" aria-label="three cards: the task, the agent working in its sandbox, and the verifier that sets the reward"></svg></div>
        <figcaption class="lora-fx__caption" aria-live="polite"></figcaption>
      </figure>
    </figure>
<script src="tasktypes.js"></script>
</body>
</html>
