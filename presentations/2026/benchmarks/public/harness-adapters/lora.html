<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One base model, many adapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  /* Embedded in the blog post: no page chrome, the post's background shows through */
  body { background: transparent; }
  figure, figure.wide { margin: 0; }
</style>
<meta property="og:title" content="Harness adapters figures"><meta property="og:image" content="https://cdn-thumbnails.huggingface.co/social-thumbnails/spaces/harness-hub/harness-adapters-figures.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://cdn-thumbnails.huggingface.co/social-thumbnails/spaces/harness-hub/harness-adapters-figures.png"></head>
<body>
    <figure class="wide">
      <figure class="lora-fx" id="lora-fx" aria-label="animated diagram: one base model serving many LoRA adapters, in training and in evaluation">
        <div class="lora-fx__header">
          <span class="lora-fx__title">One base model, many adapters</span>
          <span class="lora-fx__seg" role="group" aria-label="mode">
            <button class="lora-fx__btn on" data-lora-mode="training">training</button>
            <button class="lora-fx__btn" data-lora-mode="evaluation">evaluation</button>
          </span>
          <button class="lora-fx__btn" data-lora-play>pause</button>
          <button class="lora-fx__btn" data-lora-replay>replay</button>
          <label class="lora-fx__speed">speed <input type="range" min="0.5" max="2.5" step="0.5" value="1.5" data-lora-speed><span class="lora-fx__speed-val">1.5×</span></label>
        </div>
        <div class="lora-fx__body"><svg viewBox="0 44 1000 376" role="img" aria-label="harness sandboxes, one vLLM with the base weights and adapters, and the trainers or the scores"></svg></div>
        <figcaption class="lora-fx__caption" aria-live="polite"></figcaption>
      </figure>
    </figure>
<script src="lora.js"></script>
</body>
